name: Feature request
description: A protocol, tool or workflow you'd like supported
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the device, protocol or task, and where the current tool gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you'd like it to work
