name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            args: "--no-default-features --features tui"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: "--no-default-features --features tui,udev"
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            args: "--no-default-features --features tui,udev"
          - os: macos-13
            target: x86_64-apple-darwin
            args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux GUI build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release ${{ matrix.args }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN=serial-mcp
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            BIN=serial-mcp.exe
            EXT=".exe"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/serial-mcp-${{ matrix.target }}${EXT}"
          cp README.md LICENSE dist/
          tar -czf "serial-mcp-${{ matrix.target }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: serial-mcp-${{ matrix.target }}
          path: serial-mcp-${{ matrix.target }}.tar.gz

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
