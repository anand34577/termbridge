[package]
name = "termbridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform serial / TCP / UDP terminal with MCP server and headless mode"

[[bin]]
name = "termbridge"
path = "src/main.rs"

[features]
default = ["gui", "tui", "udev"]
udev = ["termbridge-core/udev"]
gui = ["dep:termbridge-gui"]
tui = ["dep:termbridge-tui"]

[dependencies]
termbridge-core = { workspace = true }
termbridge-mcp = { workspace = true }
termbridge-gui = { workspace = true, optional = true }
termbridge-tui = { workspace = true, optional = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
