# Cross-compilation configuration for `cross`.
# serialport uses libudev on Linux for USB metadata, so the cross images need
# the target architecture's development package (multiarch), not the host's.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libudev-dev:$CROSS_DEB_ARCH",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libudev-dev:$CROSS_DEB_ARCH",
]
