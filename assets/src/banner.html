<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1600px;height:400px;overflow:hidden}
  body{background:#0C0F14;color:#F4F7FB;font-family:Inter,'Segoe UI',system-ui,sans-serif;position:relative;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px}
  .left{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:660px}
  .brand{display:flex;align-items:center;gap:20px;margin-bottom:22px}
  .brand img{width:64px;height:64px}
  h1{font-size:68px;font-weight:800;letter-spacing:-.03em;margin:0}
  p{font-size:25px;line-height:1.4;color:#A3AEBF;margin:0 0 26px}
  .chips{display:flex;gap:10px}
  .chip{font:500 15px 'JetBrains Mono',Consolas,monospace;color:#D9E0EA;border:1px solid #2A3240;background:#141922;border-radius:8px;padding:7px 12px}
  .chip b{color:#4C9AFF;font-weight:500}
  .shot{position:absolute;left:820px;top:56px;width:900px;height:430px;border-radius:14px;overflow:hidden;
    border:1px solid #2A3240;box-shadow:0 30px 70px rgba(0,0,0,.6)}
  .shot img{width:1185px;margin:-58px 0 0 -262px}
</style></head><body>
  <div class="left">
    <div class="brand"><img src="../logo.svg" alt=""><h1>Termbridge</h1></div>
    <p>Serial, TCP and UDP terminal with a desktop GUI, a terminal UI and an MCP server for AI agents. One Rust binary.</p>
    <div class="chips"><span class="chip"><b>$</b> termbridge</span><span class="chip"><b>$</b> termbridge tui</span><span class="chip"><b>$</b> termbridge mcp</span></div>
  </div>
  <div class="shot"><img src="shots/gui-session.png" alt=""></div>
</body></html>
