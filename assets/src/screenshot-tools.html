<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1720px;height:1052px;overflow:hidden}
  body{background:#0C0F14;font-family:Inter,'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px}
  .win{border-radius:14px;overflow:hidden;border:1px solid #2A3240;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#12161D}
  .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#161B23;border-bottom:1px solid #232A35}
  .dot{width:12px;height:12px;border-radius:50%}
  .title{flex:1;text-align:center;color:#8A95A7;font-size:14px;font-weight:500;margin-right:60px}
  img{display:block;width:1580px;height:874px}
</style></head><body>
<div class="win">
  <div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span class="title">Serial MCP</span></div>
  <img src="shots/gui-tools.png" alt="">
</div></body></html>
